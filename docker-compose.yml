services:
  source:
    image: postgres:17
    container_name: dwh_demo_source
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
    ports:
      - "${SOURCE_DB_PORT}:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
    networks:
      - dwh_network

  dwh:
    image: postgres:16
    container_name: dwh_demo_dwh
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DWH_DB_USER}
      POSTGRES_PASSWORD: ${DWH_DB_PASSWORD}
      POSTGRES_DB: ${DWH_DB_NAME}
    ports:
      - "${DWH_DB_PORT}:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data
    networks:
      - dwh_network

volumes:
  source_data:
  dwh_data:

networks:
  dwh_network:
    driver: bridge
